<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shane Battles{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/home.css') }}">
</head>

<body>

    <nav>
        <div class="container">
            <ul class="menu">
                <!-- Checks the Flask endpoint name to apply the active class -->
                <li>
                    <a href="{{ url_for('home') }}"
                       class="{{ 'active' if request.endpoint == 'home' else '' }}">Home</a>
                </li>
                <li>
                    <a href="{{ url_for('contact') }}"
                       class="{{ 'active' if request.endpoint == 'contact' else '' }}">Contact</a>
                </li>
                <li>
                    <a href="{{ url_for('projects') }}"
                       class="{{ 'active' if request.endpoint == 'projects' else '' }}">Projects</a>
                </li>
            </ul>
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
