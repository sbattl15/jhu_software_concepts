name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    # Start a PostgreSQL server for the test run
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Test database environment
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: test_db
      # Lets tests import from module_04 and module_04/src
      PYTHONPATH: ${{ github.workspace }}/module_04:${{ github.workspace }}/module_04/src

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: module_04/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f module_04/requirements.txt ]; then
            pip install -r module_04/requirements.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest pytest-cov "psycopg[binary]"

      - name: Initialize database (load_data.py)
        working-directory: module_04
        run: |
          JSON_FILE=$(find . -name llm_extend_applicant_data.json | head -n 1)
          if [ -z "$JSON_FILE" ]; then
            echo "::error::llm_extend_applicant_data.json not found under module_04 - is it committed (and not in .gitignore)?"
            exit 1
          fi
          echo "Loading $JSON_FILE"
          python src/load_data.py --json-file "$JSON_FILE"

      - name: Run full pytest suite with coverage
        run: |
          MARKS="web or buttons or analysis or db or integration"
          if [ -f pytest.ini ]; then
            echo "Using ./pytest.ini"
            pytest -m "$MARKS"
          elif [ -f module_04/pytest.ini ]; then
            echo "Using module_04/pytest.ini"
            pytest -c module_04/pytest.ini --rootdir=module_04 -m "$MARKS" module_04
          else
            echo "::error::pytest.ini not found at repo root or in module_04"
            exit 1
          fi