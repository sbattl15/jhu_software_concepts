name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # Start a PostgreSQL server for the test run
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Test database environment (add any other variable names your code reads)
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: test_db
      # Lets tests import from module_04 and module_04/src
      PYTHONPATH: ${{ github.workspace }}/module_04:${{ github.workspace }}/module_04/src

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f module_04/requirements.txt ]; then
            pip install -r module_04/requirements.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest pytest-cov

      - name: Wait for PostgreSQL
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done

      # Step 4: create and load tables before tests run
      - name: Initialize database (load_data.py)
        working-directory: module_04/src
        run: python load_data.py

      # Step 3: run the full suite with coverage, wherever pytest.ini lives.
      # Always runs from the repo root so --cov=module_04/src resolves correctly.
      - name: Run full pytest suite with coverage
        run: |
          MARKS="web or buttons or analysis or db or integration"
          if [ -f pytest.ini ]; then
            echo "Using ./pytest.ini"
            pytest -m "$MARKS"
          elif [ -f module_04/pytest.ini ]; then
            echo "Using module_04/pytest.ini"
            pytest -c module_04/pytest.ini --rootdir=module_04 -m "$MARKS" module_04
          else
            echo "pytest.ini not found" && exit 1
          fi